services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: jobspy-backend
    env_file:
      - path: ../../.env
        required: false
      - path: .env
        required: false
    environment:
      - DATABASE_URL=sqlite:////app/data/jobs.db
      - SCHEDULE_CRON=0 19 * * *
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: jobspy-scheduler
    command: ["python", "-m", "app.scheduler"]
    env_file:
      - path: ../../.env
        required: false
      - path: .env
        required: false
    environment:
      - DATABASE_URL=sqlite:////app/data/jobs.db
      - SCHEDULE_CRON=0 19 * * *
    volumes:
      - ./data:/app/data
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: jobspy-frontend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
